name: Secret scanning

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          path: repository
      - name: Resolve latest Picket release
        id: picket
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh api repos/willibrandon/picket/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"
      - name: Download latest released Picket action
        uses: actions/checkout@v7
        with:
          repository: willibrandon/picket
          ref: ${{ steps.picket.outputs.tag }}
          path: .actions/picket
          persist-credentials: false
      - uses: ./.actions/picket
        with:
          path: repository
          redact: 100
          fail-on: findings
