name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 9 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          queries: security-and-quality
          build-mode: manual
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet build scripts/setup-auth.cs --configuration Release
      - run: dotnet build scripts/restore-state.cs --configuration Release
      - run: dotnet build scripts/run-maintenance.cs --configuration Release
      - run: dotnet build scripts/run-maintenance-tests.cs --configuration Release
      - run: dotnet build scripts/check-codeql.cs --configuration Release
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          output: ${{ runner.temp }}/codeql-results
          upload: failure-only
      - name: Filter SDK-generated style findings
        uses: advanced-security/filter-sarif@v1.1
        with:
          input: ${{ runner.temp }}/codeql-results/csharp.sarif
          output: ${{ runner.temp }}/codeql-results/csharp.sarif
          patterns: |
            -**/obj/**/generated/System.Text.Json.SourceGeneration/**/*.cs:cs/useless-cast-to-self
            -**/obj/**/generated/System.Text.RegularExpressions.Generator/**/*.cs:cs/useless-cast-to-self
            -**/obj/**/generated/System.Text.RegularExpressions.Generator/**/*.cs:cs/useless-assignment-to-local
            -**/obj/**/generated/System.Text.RegularExpressions.Generator/**/*.cs:cs/nested-if-statements
      - name: Upload findings
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/codeql-results/csharp.sarif
          category: .github/workflows/codeql.yml:analyze
      - name: Require a clean analysis
        run: dotnet run --file scripts/check-codeql.cs -- "$RUNNER_TEMP/codeql-results/csharp.sarif"
