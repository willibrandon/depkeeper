version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: daily
      time: '08:17'
      timezone: Etc/UTC
    cooldown:
      default-days: 3
    groups:
      dotnet-dependencies:
        patterns: ['*']
    assignees: [willibrandon]
    labels: [dependencies]
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: '08:17'
      timezone: Etc/UTC
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ['*']
    assignees: [willibrandon]
    labels: [dependencies]
    open-pull-requests-limit: 10
