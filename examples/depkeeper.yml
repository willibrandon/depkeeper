# Proposed configuration for the initial implementation.
version: 1

repositories:
  - repository: OWNER/REPOSITORY
    base: main
    install:
      - npm ci
    verify:
      - npm test
    required-checks:
      - CI

limits:
  concurrent-repairs: 1
  repair-attempts-per-pr: 2
  repair-timeout-minutes: 30

merge:
  method: squash
  require-current-head: true
  require-up-to-date-branch: true

reports:
  deduplicate-blockers: true
